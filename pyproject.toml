[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-attribute-extraction"
version = "0.1.0"
description = "fastText + dynamic attribute shortlist + GLiNER2 for marketplace queries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow>=15,<20",
  "scikit-learn>=1.4,<1.7",
  "fasttext-wheel>=0.9.2",
  "gliner2[local]==1.3.2",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
